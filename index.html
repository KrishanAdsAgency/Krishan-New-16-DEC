<style>
:root{
    --bg:#0A0F1F;
    --card:#131C31;
    --primary:#00FFB2;
    --secondary:#00C6FF;
    --text:#ffffff;
    --muted:#A8B8D8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top right, rgba(0,255,178,.18), transparent 40%),
    radial-gradient(circle at bottom left, rgba(0,198,255,.18), transparent 40%),
    var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
}

.container{
    width:90%;
    max-width:420px;
    padding:45px 30px;
    border-radius:24px;
    text-align:center;
    background:var(--card);
    border:1px solid rgba(0,255,178,.25);
    box-shadow:
        0 20px 50px rgba(0,0,0,.6),
        0 0 30px rgba(0,255,178,.12);
}

.logo{
    width:110px;
    height:110px;
    margin:0 auto 25px;
    border-radius:50%;
    background:linear-gradient(135deg,#00FFB2,#00C6FF);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Orbitron',sans-serif;
    font-size:38px;
    font-weight:900;
    color:#fff;
    box-shadow:
        0 0 30px rgba(0,255,178,.35),
        0 0 60px rgba(0,198,255,.20);
}

.title{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(24px,6vw,34px);
    font-weight:900;
    margin-bottom:10px;
    background:linear-gradient(90deg,#00FFB2,#00C6FF);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:var(--muted);
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:30px;
}

.timer-circle{
    width:120px;
    height:120px;
    margin:0 auto 30px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.08);
    border-top:4px solid var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:spin 1s linear infinite;
}

.timer-val{
    font-family:'Orbitron',sans-serif;
    font-size:40px;
    color:var(--primary);
    text-shadow:0 0 20px rgba(0,255,178,.5);
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.btn-group{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.join-btn{
    text-decoration:none;
    background:linear-gradient(135deg,#00FFB2,#00C6FF);
    color:#fff;
    padding:18px;
    border-radius:14px;
    font-weight:800;
    text-transform:uppercase;
    transition:.3s;
    box-shadow:0 0 25px rgba(0,255,178,.25);
}

.join-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 0 35px rgba(0,255,178,.35);
}

.footer{
    margin-top:20px;
    color:var(--muted);
    font-size:12px;
}

@media(max-width:480px){
    .container{
        padding:35px 20px;
    }

    .timer-circle{
        width:100px;
        height:100px;
    }

    .timer-val{
        font-size:34px;
    }
}
</style>

<script>
let timeLeft = 10;

const timerText = document.getElementById("timer-text");

const countdown = setInterval(() => {

    timeLeft--;

    if(timeLeft >= 0){
        timerText.textContent = timeLeft;
    }

    if(timeLeft <= 0){
        clearInterval(countdown);
        window.location.href = "https://t.me/+DdGzUN6WF3k2N2Fl";
    }

}, 1000);
</script>
